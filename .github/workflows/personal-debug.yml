name: HexDroid Personal - APK debug

on:
  push:
    branches:
      - feat/personal-phase1-whois-notice
      - feat/personal-phase2
      - feat/personal-phase3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build and upload installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure optional stable development signature
        env:
          PERSONAL_DEBUG_KEYSTORE_B64: ${{ secrets.PERSONAL_DEBUG_KEYSTORE_B64 }}
          PERSONAL_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_DEBUG_KEYSTORE_PASSWORD }}
          PERSONAL_DEBUG_KEY_ALIAS: ${{ secrets.PERSONAL_DEBUG_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PERSONAL_DEBUG_KEYSTORE_B64$PERSONAL_DEBUG_KEYSTORE_PASSWORD$PERSONAL_DEBUG_KEY_ALIAS" ]]; then
            test -n "$PERSONAL_DEBUG_KEYSTORE_B64" && test -n "$PERSONAL_DEBUG_KEYSTORE_PASSWORD" && test -n "$PERSONAL_DEBUG_KEY_ALIAS"
            [[ "$PERSONAL_DEBUG_KEYSTORE_PASSWORD" != *$'\n'* && "$PERSONAL_DEBUG_KEYSTORE_PASSWORD" != *$'\r'* ]]
            [[ "$PERSONAL_DEBUG_KEY_ALIAS" != *$'\n'* && "$PERSONAL_DEBUG_KEY_ALIAS" != *$'\r'* ]]
            umask 077
            printf '%s' "$PERSONAL_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/personal-debug.keystore"
            {
              echo "PERSONAL_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/personal-debug.keystore"
              echo "PERSONAL_DEBUG_KEYSTORE_PASSWORD=$PERSONAL_DEBUG_KEYSTORE_PASSWORD"
              echo "PERSONAL_DEBUG_KEY_ALIAS=$PERSONAL_DEBUG_KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo 'Firma de desarrollo estable configurada mediante GitHub Secrets.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::No stable debug signing secrets configured. This APK uses a new development key and may not update an earlier installation. Back up first; never uninstall without exporting your data.'
            echo 'Firma debug temporal: puede requerir reinstalación. Exportá ajustes, scripts e historiales antes de desinstalar la versión anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK and run unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2 --no-configuration-cache

      - name: Enable KVM for Android UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android test image with download diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install emulator 'system-images;android-35;default;x86_64' > "$RUNNER_TEMP/android-image-install.log" 2>&1; then
              cat "$RUNNER_TEMP/android-image-install.log"
              exit 0
            fi
            cat "$RUNNER_TEMP/android-image-install.log"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          python3 - <<'PY'
          import os, pathlib
          diagnostic = pathlib.Path(os.environ['RUNNER_TEMP'], 'android-image-install.log').read_text(errors='replace')[-6000:]
          print('::error::Android test image installation failed: ' + diagnostic.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          exit 1

      - name: Test WHOIS and Phase 3 persistence and UI on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --no-configuration-cache

      - name: Summarize executed tests
        if: always()
        shell: python
        run: |
          import os, pathlib, re, xml.etree.ElementTree as E
          report_paths = sorted({p for p in pathlib.Path('app/build').rglob('*.xml') if 'result' in str(p).lower() or 'report' in str(p).lower()})
          expected = 'roomRemainsWhilePanelMovesMinimizesRestoresAndCloses'
          overlay_executed = False
          phase3_passed = set()
          discovered = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Resultados de pruebas\n')
              for path in report_paths:
                  root = E.parse(path).getroot()
                  cases = list(root.iter('testcase'))
                  if not cases:
                      continue
                  out.write(f"- {path}: {len(cases)} pruebas\n")
                  for case in cases:
                      identity = case.get('classname', '') + '.' + case.get('name', '')
                      discovered.append(identity)
                      if 'PersonalPhase3' in case.get('classname', '') and case.find('skipped') is None and case.find('failure') is None and case.find('error') is None:
                          phase3_passed.add(identity)
                      if expected in case.get('name', '') and case.find('skipped') is None and case.find('failure') is None and case.find('error') is None:
                          overlay_executed = True
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          out.write(f"\n```text\n{identity}: {(failure.text or failure.get('message', ''))[:6000]}\n```\n")
                          diagnostic = identity + ': ' + (failure.text or failure.get('message', ''))[:4000]
                          print('::error::' + diagnostic.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          if os.environ.get('GITHUB_REF_NAME') == 'feat/personal-phase3':
              sources = [pathlib.Path('app/src/test/java/com/boxlabs/hexdroid/PersonalPhase3Test.kt')]
              sources += [pathlib.Path('app/src/androidTest/java/com/boxlabs/hexdroid', name) for name in ['PersonalPhase3StorageTest.kt', 'PersonalPhase3UiTest.kt', 'PersonalPhase3PrivateFlowTest.kt']]
              for source in sources:
                  methods = re.findall(r'@Test\s+fun\s+(\w+)\s*\(', source.read_text())
                  if not methods:
                      raise SystemExit('No tests found in required suite: ' + str(source))
                  for method in methods:
                      required = source.stem + '.' + method
                      if not any(required in case for case in phase3_passed):
                          diagnostic = 'Required Phase 3 test not passed: ' + required
                          print('::error::' + diagnostic)
                          raise SystemExit(diagnostic)
          if not overlay_executed:
              diagnostic = ('Required WHOIS UI test not found as passed. Reports: ' + str([str(p) for p in report_paths]) + '; cases: ' + str(discovered))[:5000]
              print('::error::' + diagnostic)
              raise SystemExit(diagnostic)


      - name: Upload diagnostic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase3-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify signature and personal identity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.malekira.hexdroid.personal.debug'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'HexDroid Personal'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p apk-download
          cp "$apk" apk-download/HexDroid-Personal-debug.apk
          (cd apk-download && sha256sum HexDroid-Personal-debug.apk > SHA256SUMS.txt)

      - name: Upload APK for download from Android
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: HexDroid-Personal-debug
          path: apk-download/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/personal-debug.keystore"

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## HexDroid Personal — descarga para Android'
            echo
            echo "[Descargar APK debug (ZIP)]($ARTIFACT_URL)"
            echo
            echo 'Inicia sesión en GitHub, descarga el ZIP y extráelo con Mis archivos de Samsung.'
            echo 'Abre HexDroid-Personal-debug.apk y autoriza la instalación desde esa fuente si Android lo solicita.'
            echo 'La APK usa com.malekira.hexdroid.personal.debug y convive con HexDroid oficial.'
            echo "Código compilado: $GITHUB_SHA"
            echo 'El archivo estará disponible durante 30 días. No se publica ninguna clave privada.'
          } >> "$GITHUB_STEP_SUMMARY"

  review-pr:
    name: Open Phase 3 review PR
    if: github.ref == 'refs/heads/feat/personal-phase3'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Open or locate the review PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report_error() {
            error=$(tr '\n' ' ' < "$RUNNER_TEMP/pr-error.txt")
            echo "::error::$error"
            echo '## No se pudo abrir el PR desde Actions' >> "$GITHUB_STEP_SUMMARY"
            echo "$error" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --method GET -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$GITHUB_REF_NAME" -f base=feat/personal-phase2 --jq '.[0].html_url // ""' 2> "$RUNNER_TEMP/pr-error.txt"); then
            report_error
          fi
          if [ -n "$existing" ]; then
            url="$existing"
          else
            python3 - <<'PYCODE'
          import json, os, pathlib
          payload = {'title': 'HexDroid Personal — Fase 3: temas, formato, historial y solicitudes de privados', 'head': os.environ['GITHUB_REF_NAME'], 'base': 'feat/personal-phase2', 'body': pathlib.Path('docs/PERSONAL_PHASE3_PR.md').read_text()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'phase3-pr.json').write_text(json.dumps(payload))
          PYCODE
            if ! url=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --method POST --input "$RUNNER_TEMP/phase3-pr.json" --jq '.html_url' 2> "$RUNNER_TEMP/pr-error.txt"); then
              report_error
            fi
          fi
          echo "[PR de Fase 3 para revisión]($url)" >> "$GITHUB_STEP_SUMMARY"
