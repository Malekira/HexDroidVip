name: HexDroid Personal - APK debug

on:
  push:
    branches:
      - feat/personal-phase1-whois-notice
      - feat/personal-phase2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build and upload installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Enable KVM for Android UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the internal WHOIS panel on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2

      - name: Summarize executed tests
        if: always()
        shell: python
        run: |
          import os, pathlib, xml.etree.ElementTree as E
          roots = [pathlib.Path('app/build/test-results/testDebugUnitTest'), pathlib.Path('app/build/outputs/androidTest-results/connected')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Resultados de pruebas\n')
              for root in roots:
                  for path in sorted(root.rglob('TEST-*.xml')):
                      suite = E.parse(path).getroot()
                      out.write(f"- {suite.get('name')}: {suite.get('tests')} pruebas, {suite.get('failures', '0')} fallos, {suite.get('errors', '0')} errores, {suite.get('skipped', '0')} omitidas\n")
                      for case in suite.findall('testcase'):
                          for failure in list(case.findall('failure')) + list(case.findall('error')):
                              out.write(f"\n```text\n{case.get('name')}: {(failure.text or failure.get('message', ''))[:6000]}\n```\n")

      - name: Verify signature and personal identity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.malekira.hexdroid.personal.debug'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'HexDroid Personal'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p apk-download
          cp "$apk" apk-download/HexDroid-Personal-debug.apk
          (cd apk-download && sha256sum HexDroid-Personal-debug.apk > SHA256SUMS.txt)

      - name: Upload APK for download from Android
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: HexDroid-Personal-debug
          path: apk-download/
          if-no-files-found: error
          retention-days: 30

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## HexDroid Personal — descarga para Android'
            echo
            echo "[Descargar APK debug (ZIP)]($ARTIFACT_URL)"
            echo
            echo 'Inicia sesión en GitHub, descarga el ZIP y extráelo con Mis archivos de Samsung.'
            echo 'Abre HexDroid-Personal-debug.apk y autoriza la instalación desde esa fuente si Android lo solicita.'
            echo 'La APK usa com.malekira.hexdroid.personal.debug y convive con HexDroid oficial.'
            echo "Código compilado: $GITHUB_SHA"
            echo 'El archivo estará disponible durante 30 días. No se publica ninguna clave privada.'
          } >> "$GITHUB_STEP_SUMMARY"

  review-pr:
    name: Open Phase 2 review PR
    if: github.ref == 'refs/heads/feat/personal-phase2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Open or locate the review PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report_error() {
            error=$(tr '\n' ' ' < "$RUNNER_TEMP/pr-error.txt")
            echo "::error::$error"
            echo '## No se pudo abrir el PR desde Actions' >> "$GITHUB_STEP_SUMMARY"
            echo "$error" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --method GET -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$GITHUB_REF_NAME" -f base=feat/personal-phase1-whois-notice --jq '.[0].html_url // ""' 2> "$RUNNER_TEMP/pr-error.txt"); then
            report_error
          fi
          if [ -n "$existing" ]; then
            url="$existing"
          else
            python3 - <<'PYCODE'
          import json, os, pathlib
          payload = {'title': 'HexDroid Personal — Fase 2: WHOIS flotante, menciones y entrada', 'head': os.environ['GITHUB_REF_NAME'], 'base': 'feat/personal-phase1-whois-notice', 'body': pathlib.Path('docs/PERSONAL_PHASE2_PR.md').read_text()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'phase2-pr.json').write_text(json.dumps(payload))
          PYCODE
            if ! url=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --method POST --input "$RUNNER_TEMP/phase2-pr.json" --jq '.html_url' 2> "$RUNNER_TEMP/pr-error.txt"); then
              report_error
            fi
          fi
          echo "[PR de Fase 2 para revisión]($url)" >> "$GITHUB_STEP_SUMMARY"
