name: HexDroid Dreams - APK

on:
  push:
    branches:
      - feat/personal-phase1-whois-notice
      - feat/personal-phase2
      - feat/personal-phase3
      - feat/hexdroid-dreams-release
      - feat/dreams-1.0.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build and upload installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure optional stable development signature
        env:
          PERSONAL_DEBUG_KEYSTORE_B64: ${{ secrets.PERSONAL_DEBUG_KEYSTORE_B64 }}
          PERSONAL_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_DEBUG_KEYSTORE_PASSWORD }}
          PERSONAL_DEBUG_KEY_ALIAS: ${{ secrets.PERSONAL_DEBUG_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PERSONAL_DEBUG_KEYSTORE_B64$PERSONAL_DEBUG_KEYSTORE_PASSWORD$PERSONAL_DEBUG_KEY_ALIAS" ]]; then
            test -n "$PERSONAL_DEBUG_KEYSTORE_B64" && test -n "$PERSONAL_DEBUG_KEYSTORE_PASSWORD" && test -n "$PERSONAL_DEBUG_KEY_ALIAS"
            [[ "$PERSONAL_DEBUG_KEYSTORE_PASSWORD" != *$'\n'* && "$PERSONAL_DEBUG_KEYSTORE_PASSWORD" != *$'\r'* ]]
            [[ "$PERSONAL_DEBUG_KEY_ALIAS" != *$'\n'* && "$PERSONAL_DEBUG_KEY_ALIAS" != *$'\r'* ]]
            umask 077
            printf '%s' "$PERSONAL_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/personal-debug.keystore"
            {
              echo "PERSONAL_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/personal-debug.keystore"
              echo "PERSONAL_DEBUG_KEYSTORE_PASSWORD=$PERSONAL_DEBUG_KEYSTORE_PASSWORD"
              echo "PERSONAL_DEBUG_KEY_ALIAS=$PERSONAL_DEBUG_KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo 'Firma de desarrollo estable configurada mediante GitHub Secrets.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::No stable debug signing secrets configured. This APK uses a new development key and may not update an earlier installation. Back up first; never uninstall without exporting your data.'
            echo 'Firma debug temporal: puede requerir reinstalación. Exportá ajustes, scripts e historiales antes de desinstalar la versión anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK and run unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2 --no-configuration-cache

      - name: Check stable signing with disposable test keys
        if: github.ref == 'refs/heads/feat/hexdroid-dreams-release'
        run: python3 -B tools/test_dreams_signing_vault.py --apk app/build/outputs/apk/debug/app-debug.apk --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"

      - name: Enable KVM for Android UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android test image with download diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install emulator 'system-images;android-35;default;x86_64' > "$RUNNER_TEMP/android-image-install.log" 2>&1; then
              cat "$RUNNER_TEMP/android-image-install.log"
              exit 0
            fi
            cat "$RUNNER_TEMP/android-image-install.log"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          python3 - <<'PY'
          import os, pathlib
          diagnostic = pathlib.Path(os.environ['RUNNER_TEMP'], 'android-image-install.log').read_text(errors='replace')[-6000:]
          print('::error::Android test image installation failed: ' + diagnostic.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          exit 1

      - name: Test WHOIS and Phase 3 persistence and UI on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --no-configuration-cache

      - name: Summarize executed tests
        if: always()
        shell: python
        run: |
          import os, pathlib, re, xml.etree.ElementTree as E
          report_paths = sorted({p for p in pathlib.Path('app/build').rglob('*.xml') if 'result' in str(p).lower() or 'report' in str(p).lower()})
          expected = 'roomRemainsWhilePanelMovesMinimizesRestoresAndCloses'
          overlay_executed = False
          phase3_passed = set()
          discovered = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Resultados de pruebas\n')
              for path in report_paths:
                  root = E.parse(path).getroot()
                  cases = list(root.iter('testcase'))
                  if not cases:
                      continue
                  out.write(f"- {path}: {len(cases)} pruebas\n")
                  for case in cases:
                      identity = case.get('classname', '') + '.' + case.get('name', '')
                      discovered.append(identity)
                      if any(suite in case.get('classname', '') for suite in ('PersonalPhase3', 'Dreams104')) and case.find('skipped') is None and case.find('failure') is None and case.find('error') is None:
                          phase3_passed.add(identity)
                      if expected in case.get('name', '') and case.find('skipped') is None and case.find('failure') is None and case.find('error') is None:
                          overlay_executed = True
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          out.write(f"\n```text\n{identity}: {(failure.text or failure.get('message', ''))[:6000]}\n```\n")
                          diagnostic = identity + ': ' + (failure.text or failure.get('message', ''))[:4000]
                          print('::error::' + diagnostic.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          if os.environ.get('GITHUB_REF_NAME') in ('feat/personal-phase3', 'feat/hexdroid-dreams-release', 'feat/dreams-1.0.4'):
              sources = [pathlib.Path('app/src/test/java/com/boxlabs/hexdroid/PersonalPhase3Test.kt')]
              sources += [pathlib.Path('app/src/androidTest/java/com/boxlabs/hexdroid', name) for name in ['PersonalPhase3StorageTest.kt', 'PersonalPhase3UiTest.kt', 'PersonalPhase3PrivateFlowTest.kt']]
              if os.environ.get('GITHUB_REF_NAME') == 'feat/dreams-1.0.4':
                  sources += [pathlib.Path('app/src/test/java/com/boxlabs/hexdroid/Dreams104Test.kt')]
                  sources += [pathlib.Path('app/src/androidTest/java/com/boxlabs/hexdroid', name) for name in ['Dreams104AndroidTest.kt', 'Dreams104UiTest.kt']]
              for source in sources:
                  methods = re.findall(r'@Test\s+fun\s+(\w+)\s*\(', source.read_text())
                  if not methods:
                      raise SystemExit('No tests found in required suite: ' + str(source))
                  for method in methods:
                      required = source.stem + '.' + method
                      if not any(required in case for case in phase3_passed):
                          diagnostic = 'Required Phase 3 test not passed: ' + required
                          print('::error::' + diagnostic)
                          raise SystemExit(diagnostic)
          if not overlay_executed:
              diagnostic = ('Required WHOIS UI test not found as passed. Reports: ' + str([str(p) for p in report_paths]) + '; cases: ' + str(discovered))[:5000]
              print('::error::' + diagnostic)
              raise SystemExit(diagnostic)


      - name: Upload diagnostic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase3-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify signature and personal identity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.malekira.hexdroid.personal.debug'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'HexDroid Dreams'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p apk-download
          cp "$apk" apk-download/HexDroid-Dreams-debug.apk
          (cd apk-download && sha256sum HexDroid-Dreams-debug.apk > SHA256SUMS.txt)

      - name: Upload APK for download from Android
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: HexDroid-Dreams-debug
          path: apk-download/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/personal-debug.keystore"

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## HexDroid Dreams — descarga de prueba para Android'
            echo
            echo "[Descargar APK debug (ZIP)]($ARTIFACT_URL)"
            echo
            echo 'Inicia sesión en GitHub, descarga el ZIP y extráelo con Mis archivos de Samsung.'
            echo 'Abre HexDroid-Dreams-debug.apk y autoriza la instalación desde esa fuente si Android lo solicita.'
            echo 'La APK usa com.malekira.hexdroid.personal.debug y convive con HexDroid oficial.'
            echo "Código compilado: $GITHUB_SHA"
            echo 'El archivo estará disponible durante 30 días. No se publica ninguna clave privada.'
          } >> "$GITHUB_STEP_SUMMARY"

  release-signing:
    name: Check final release signing readiness
    if: github.ref == 'refs/heads/feat/hexdroid-dreams-release'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Require a complete stable release identity
        id: check
        env:
          DREAMS_SIGNING_PASSWORD: ${{ secrets.DREAMS_SIGNING_PASSWORD }}
          DREAMS_RELEASE_KEYSTORE_B64: ${{ secrets.DREAMS_RELEASE_KEYSTORE_B64 }}
          DREAMS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DREAMS_RELEASE_KEYSTORE_PASSWORD }}
          DREAMS_RELEASE_KEY_ALIAS: ${{ secrets.DREAMS_RELEASE_KEY_ALIAS }}
          DREAMS_RELEASE_KEY_PASSWORD: ${{ secrets.DREAMS_RELEASE_KEY_PASSWORD }}
        shell: python
        run: |
          import os
          password = os.environ.get('DREAMS_SIGNING_PASSWORD', '')
          names = ['DREAMS_RELEASE_KEYSTORE_B64', 'DREAMS_RELEASE_KEYSTORE_PASSWORD', 'DREAMS_RELEASE_KEY_ALIAS', 'DREAMS_RELEASE_KEY_PASSWORD']
          present = [bool(os.environ.get(name)) for name in names]
          if password and any(present):
              raise SystemExit('Elegí un solo método de firma: DREAMS_SIGNING_PASSWORD o los cuatro secretos de clave importada. No se reemplazará una identidad existente.')
          if password and (not 20 <= len(password) <= 128 or any(not 32 <= ord(c) <= 126 for c in password)):
              raise SystemExit('DREAMS_SIGNING_PASSWORD requiere entre 20 y 128 caracteres, sin saltos de línea, acentos ni emojis.')
          if any(present) and not all(present):
              raise SystemExit('Firma final incompleta: configurá los cuatro secretos DREAMS_RELEASE antes de generar la APK final.')
          ready = bool(password) or all(present)
          mode = 'vault' if password else 'provided'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('ready=' + str(ready).lower() + '\n')
              out.write('mode=' + mode + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Firma de HexDroid Dreams\n')
              out.write('Firma estable configurada; la APK final requiere que las pruebas aprueben.\n' if ready else 'APK final pendiente: agregá DREAMS_SIGNING_PASSWORD en GitHub Secrets. No requiere instalar aplicaciones. Ver docs/DREAMS_SIGNING_SIMPLE.md.\n')
          if not ready:
              print('::warning::APK final pendiente de firma estable. No se publicará una APK release sin firma ni con la clave debug temporal.')

  dreams-release:
    name: Build and upload final signed APK
    needs: [debug-apk, release-signing]
    if: needs.release-signing.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: dreams-signing-vault
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare permanent signing in a private GitHub draft
        if: needs.release-signing.outputs.mode == 'vault'
        env:
          GH_TOKEN: ${{ github.token }}
          DREAMS_SIGNING_PASSWORD: ${{ secrets.DREAMS_SIGNING_PASSWORD }}
        run: python3 tools/dreams_signing_vault.py --directory "$RUNNER_TEMP/dreams-signing"
      - name: Configure imported stable release signing
        if: needs.release-signing.outputs.mode == 'provided'
        env:
          DREAMS_RELEASE_KEYSTORE_B64: ${{ secrets.DREAMS_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DREAMS_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DREAMS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DREAMS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value="${!name}"
            test -n "$value"
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]]
          done
          umask 077
          printf '%s' "$DREAMS_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreams-release.keystore"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/dreams-release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build optimized release with mandatory signing
        run: bash ./gradlew :app:assembleRelease -PrequireSigning=true --no-daemon --max-workers=2 --no-configuration-cache
      - name: Verify final APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          mkdir -p dreams-release-download
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" > dreams-release-download/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/dreams-release-badging.txt"
          grep -F "package: name='com.malekira.hexdroid.personal'" "$RUNNER_TEMP/dreams-release-badging.txt"
          grep -F "application-label:'HexDroid Dreams'" "$RUNNER_TEMP/dreams-release-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/dreams-release-badging.txt"; then
            echo '::error::La APK final no debe ser depurable.'
            exit 1
          fi
          cp "$apk" dreams-release-download/HexDroid-Dreams-release.apk
          (cd dreams-release-download && sha256sum HexDroid-Dreams-release.apk > SHA256SUMS.txt)
      - name: Upload final APK
        id: final-apk
        uses: actions/upload-artifact@v4
        with:
          name: HexDroid-Dreams-release
          path: dreams-release-download/
          if-no-files-found: error
          retention-days: 30
      - name: Remove release signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dreams-release.keystore"
          rm -rf "$RUNNER_TEMP/dreams-signing"
      - name: Final APK download instructions
        env:
          ARTIFACT_URL: ${{ steps.final-apk.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo '## HexDroid Dreams — APK final firmada'
            echo "[Descargar APK final (ZIP)]($ARTIFACT_URL)"
            echo 'Abrí el ZIP en Mis archivos de Samsung y luego HexDroid-Dreams-release.apk.'
            echo 'Paquete: com.malekira.hexdroid.personal. Se instala junto a la prueba .debug; exportá e importá los datos que quieras trasladar.'
            echo 'No es una publicación en GitHub Releases ni un merge. El artifact dura 30 días.'
          } >> "$GITHUB_STEP_SUMMARY"

  review-pr:
    name: Open Phase 3 review PR
    if: github.ref == 'refs/heads/feat/personal-phase3'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Open or locate the review PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report_error() {
            error=$(tr '\n' ' ' < "$RUNNER_TEMP/pr-error.txt")
            echo "::error::$error"
            echo '## No se pudo abrir el PR desde Actions' >> "$GITHUB_STEP_SUMMARY"
            echo "$error" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --method GET -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$GITHUB_REF_NAME" -f base=feat/personal-phase2 --jq '.[0].html_url // ""' 2> "$RUNNER_TEMP/pr-error.txt"); then
            report_error
          fi
          if [ -n "$existing" ]; then
            url="$existing"
          else
            python3 - <<'PYCODE'
          import json, os, pathlib
          payload = {'title': 'HexDroid Personal — Fase 3: temas, formato, historial y solicitudes de privados', 'head': os.environ['GITHUB_REF_NAME'], 'base': 'feat/personal-phase2', 'body': pathlib.Path('docs/PERSONAL_PHASE3_PR.md').read_text()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'phase3-pr.json').write_text(json.dumps(payload))
          PYCODE
            if ! url=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --method POST --input "$RUNNER_TEMP/phase3-pr.json" --jq '.html_url' 2> "$RUNNER_TEMP/pr-error.txt"); then
              report_error
            fi
          fi
          echo "[PR de Fase 3 para revisión]($url)" >> "$GITHUB_STEP_SUMMARY"
